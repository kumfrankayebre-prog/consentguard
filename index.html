<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConsentGuard - Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>ConsentGuard</h1>
    <p>Upload your private content safely with watermark protection</p>
    
    <input type="file" id="fileInput" accept="image/*,video/*,application/pdf">
    <button id="uploadBtn">Preview & Add Watermark</button>
    
    <canvas id="canvas"></canvas>

    <div id="shareButtons" style="display:none;">
      <p>Share your content:</p>
      <button onclick="shareWhatsApp()">WhatsApp</button>
      <button onclick="shareFacebook()">Facebook</button>
      <button onclick="shareTikTok()">TikTok</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
